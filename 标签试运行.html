<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESJ 标签屏蔽试运行</title><style>body{margin:0;background:#f6f8fb;color:#253448;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1050px;margin:32px auto;padding:20px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{border:1px solid #dce5ed;border-radius:9px;padding:16px;background:white}.card-title{font-size:17px;margin:0 0 10px}.card-title a,.card-author a{color:#246594;text-decoration:none}.card p{font-size:13px;color:#64758a}h1{font-size:24px}a{color:#246594}</style></head><body><main><h1>标签屏蔽试运行</h1><p>以下四本为明确标注的模拟数据，用于演示网站标签与书名的区别。默认屏蔽“百合”“女性主角”后，A、B 隐藏，C、D 保留。</p><p>可打开“屏蔽标签”管理、取消或重新添加标签；名单与正式油猴脚本独立。</p><div class="shop-toolbar"></div><div class="row"><div class="col-lg-3"><div class="card"><div class="card-body"><h3 class="card-title"><a href="https://www.esjzone.one/detail/900000000000001.html">模拟小说 A</a></h3><div class="card-author"><a href="https://www.esjzone.one/tags/演示作者/">演示作者</a></div><p>模拟网站标签：百合</p></div></div></div><div class="col-lg-3"><div class="card"><div class="card-body"><h3 class="card-title"><a href="https://www.esjzone.one/detail/900000000000002.html">模拟小说 B</a></h3><div class="card-author"><a href="https://www.esjzone.one/tags/演示作者/">演示作者</a></div><p>模拟网站标签：女性主角、奇幻</p></div></div></div><div class="col-lg-3"><div class="card"><div class="card-body"><h3 class="card-title"><a href="https://www.esjzone.one/detail/900000000000003.html">标题含百合，但网站标签只有奇幻</a></h3><div class="card-author"><a href="https://www.esjzone.one/tags/演示作者/">演示作者</a></div><p>模拟网站标签：奇幻</p></div></div></div><div class="col-lg-3"><div class="card"><div class="card-body"><h3 class="card-title"><a href="https://www.esjzone.one/detail/900000000000004.html">模拟小说 D</a></h3><div class="card-author"><a href="https://www.esjzone.one/tags/演示作者/">演示作者</a></div><p>模拟网站标签：无</p></div></div></div></div><p
